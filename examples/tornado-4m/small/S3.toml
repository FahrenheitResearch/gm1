# Stage 3 of 3 of the small variant: a 20 m storm-following two-way nest (6 x 6 km, 300 x
# 300 cells, the parent's own levels) inside the parent of small/S1.toml.
# Read ../README.md first.
#
# THE SOUNDING is one GM1 ships: the Norman, Oklahoma balloon of 1800 UTC 24 May 2011
# (src/cm1core/data/soundings/koun-2011-05-24-1800z.input_sounding in the repository). It is
# a different environment from the original run's.
#
# No configuration this small has produced a tornado. Every run that did used a 32 GB card.
# This is a place to learn the steps and to look at a storm at 20 m, not a recipe for one.
#
# rstnum, duration_s, parent_i0, parent_j0 and the window's start_s and end_s are
# PLACEHOLDERS. Take the restart number, the two corner cells and the start time from
# tools/nest_place.py (docs/NESTING.md, "Placing the nest") before you run this.
[run]
irst = 1
rstnum = 8                  # PLACEHOLDER: the stage 2 restart the nest starts from
lane = "cartesian"
duration_s = 3000.0         # PLACEHOLDER: a multiple of 300 s
dt_s = 0.375
history_interval_s = 60.0
restart_interval_s = 300.0
restart_reset_frqtim = false

[initialization]
isnd = 7                    # the profile is the file passed with --sounding
iwnd = 0
irandp = 0
iinit = 1                   # one warm bubble
bubble_center_x_m = 23900.0
bubble_center_y_m = 20300.0
zc_m = 1500.0
bvrad_m = 1500.0
bhrad_m = 10000.0
bptpert_k = 4.0
maintain_rh = true

[grid]
nx = 448
ny = 448
nz = 80
dx_m = 100.0
dy_m = 100.0
dz_m = 100.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = 1               # 20 m layers below 200 m, stretching to 340 m above 7.4 km
ztop_m = 17600.0
str_bot_m = 200.0
str_top_m = 7400.0
dz_bot_m = 20.0
dz_top_m = 340.0

[dynamics]
coriolis = 1
fcor_s_inv = 8.47e-5        # 2 Omega sin(35.5 N)
lspgrad = 1                 # Coriolis acts on the departure from the base-state wind only
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2                    # open on all four sides
east = 2
south = 2
north = 2
bottom = 3                  # semi-slip ground
top = 1
radiative_order = 4

[closures]
sgs_model = 1               # TKE
bbc = 3
sfcmodel = 1
isfcflx = 0
cecd = 1
cnstcd = 0.005              # drag coefficient referenced to 10 m; roughness length 0.035 m
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 3000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true         # the grid travels with the storm
u_move_m_s = 7.5
v_move_m_s = 13.25

[physics]
component = "morrison-mp10"
ihail = 1                   # hail, as CM1's own supercell case
ndcnst = 250.0
equation_set = 2
output_dbz = false

[diagnostics]
output_uh = 1
output_vort = 0             # refused on a stretched column (CM1-OUTPUT-STRETCHED-METRIC)
output_pv = 0
output_sws = 1              # swaths: strongest surface wind, vorticity and pressure fall
output_svs = 1
output_sps = 1
output_srs = 0
output_sgs = 0
output_sus = 0
output_shs = 0
tornado_report = true

[runtime]
tile_nx = 128
tile_ny = 128
acoustic_substeps = 6
warmup_steps = 0
memory_budget_mib = 14336
capacity_profile = "default"

[lagrangian]
iprcl = 0                   # no parcels carried during the run

[nest]
refinement_ratio = 5        # 100 m / 5 = 20 m
time_refinement_ratio = 3   # child step 0.375 / 3 = 0.125 s
parent_i0 = 194             # PLACEHOLDER: from tools/nest_place.py
parent_j0 = 194             # PLACEHOLDER
parent_span_x = 60          # 60 x 60 parent cells = a 6 x 6 km child of 300 x 300 cells
parent_span_y = 60          # on a 24 GB card 100 x 100 (500 x 500 cells) also plans
spec_zone = 1
relax_zone = 4
feedback = 1                # two-way
acoustic_substeps = 6
follow_storm = true
follow_tracker = "wrf-surface-circulation"
follow_interval_s = 7.5
follow_max_speed_m_s = 20.0
follow_smoothing_radius_m = 300.0
follow_on_edge = "hold"
follow_hold_limit = 4
follow_relocation_radius_m = 2000.0

# The live tornado check of the child (an empty table: no key changes a threshold). It
# writes tornado-criterion.jsonl beside the child frames.
[nest.tornado_criterion]

# A 2 x 2 km, 1 km deep box of the child around the nest centre, one record every 0.5 s
# (4 child steps): 101 x 101 x 22 cells, 14,207,144 bytes per record, 1.70 GB per model
# minute. Over the 840 s declared here that is 1680 records, 23.9 GB.
[lagrangian.nest_child_window]
frame = "parent-grid-origin"
follow = "nest-centre"
center_x_m = 0.0
center_y_m = 0.0
half_width_x_m = 1000.0
half_width_y_m = 1000.0
top_m = 1000.0
stride_child_steps = 4
start_s = 2160.0            # PLACEHOLDER: the nest's start time
end_s = 3000.0              # PLACEHOLDER: at most duration_s
budget_bytes_per_model_minute = 1800000000
