# A smaller parent for 16 GB and 24 GB cards: 44.8 x 44.8 km at 100 m, one hour.
# Stage 1 of 3. Read ../README.md first.
#
# THE SOUNDING is one GM1 ships: the Norman, Oklahoma balloon of 1800 UTC 24 May 2011
# (src/cm1core/data/soundings/koun-2011-05-24-1800z.input_sounding in the repository). It is
# a different environment from the original run's.
#
# No configuration this small has produced a tornado. Every run that did used a 32 GB card.
# This is a place to learn the steps and to look at a storm at 20 m, not a recipe for one.
#
# The levels and the physics are ../S1.toml's. The domain is smaller, the run is one hour,
# and the moving frame and the bubble are the ones the run-geometry check asked for with
# this profile on this domain.
[run]
irst = 0                    # a fresh start
lane = "cartesian"
duration_s = 3600.0
dt_s = 0.375
history_interval_s = 300.0
restart_interval_s = 300.0
restart_reset_frqtim = true

[initialization]
isnd = 7                    # the profile is the file passed with --sounding
iwnd = 0
irandp = 0
iinit = 1                   # one warm bubble
bubble_center_x_m = 23900.0
bubble_center_y_m = 20300.0
zc_m = 1500.0
bvrad_m = 1500.0
bhrad_m = 10000.0
bptpert_k = 4.0
maintain_rh = true

[grid]
nx = 448
ny = 448
nz = 80
dx_m = 100.0
dy_m = 100.0
dz_m = 100.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = 1               # 20 m layers below 200 m, stretching to 340 m above 7.4 km
ztop_m = 17600.0
str_bot_m = 200.0
str_top_m = 7400.0
dz_bot_m = 20.0
dz_top_m = 340.0

[dynamics]
coriolis = 1
fcor_s_inv = 8.47e-5        # 2 Omega sin(35.5 N)
lspgrad = 1                 # Coriolis acts on the departure from the base-state wind only
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2                    # open on all four sides
east = 2
south = 2
north = 2
bottom = 3                  # semi-slip ground
top = 1
radiative_order = 4

[closures]
sgs_model = 1               # TKE
bbc = 3
sfcmodel = 1
isfcflx = 0
cecd = 1
cnstcd = 0.005              # drag coefficient referenced to 10 m; roughness length 0.035 m
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 3000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true         # the grid travels with the storm
u_move_m_s = 7.5
v_move_m_s = 13.25

[physics]
component = "morrison-mp10"
ihail = 1                   # hail, as CM1's own supercell case
ndcnst = 250.0
equation_set = 2
output_dbz = false

[diagnostics]
output_uh = 1
output_vort = 0             # refused on a stretched column (CM1-OUTPUT-STRETCHED-METRIC)
output_pv = 0
output_sws = 1              # swaths: strongest surface wind, vorticity and pressure fall
output_svs = 1
output_sps = 1
output_srs = 0
output_sgs = 0
output_sus = 0
output_shs = 0
tornado_report = true

[runtime]
tile_nx = 128
tile_ny = 128
acoustic_substeps = 6
warmup_steps = 0
memory_budget_mib = 12288
capacity_profile = "default"

[lagrangian]
iprcl = 0                   # no parcels carried during the run
