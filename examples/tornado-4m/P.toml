# Stage 2 of 3: the parent alone, continued from stage 1's restart 7 (2100 s) to 2700 s.
# Read README.md in this folder first. docs/NESTING.md explains every step.
#
# It writes a frame every 60 s and a restart every 180 s, so the nest of stage 3 can start
# from a restart at which the parent's rotation near the ground is steady, and so there are
# closely spaced parent frames to place the nest on. Only [run] differs from S1.toml.
#
# Run it with --restart-from pointing at the folder stage 1 wrote its restarts into.
#
# AS RUN: one RTX 5090 (32 GB), a build that predates GM1 0.1.0, 2100 to 2700 s in 911 s of
# wall time.
[run]
irst = 1
rstnum = 7                  # stage 1's restart-000007, model time 2100 s
lane = "cartesian"
duration_s = 2700.0
dt_s = 0.375
history_interval_s = 60.0
restart_interval_s = 180.0
restart_reset_frqtim = false   # keep the absolute clock: frames on multiples of 60 s, restarts on multiples of 180 s

[initialization]
isnd = 7                    # the profile is the file passed with --sounding
iwnd = 0
irandp = 0
iinit = 1                   # one warm bubble
bubble_center_x_m = 44000.0
bubble_center_y_m = 31250.0
zc_m = 1500.0
bvrad_m = 1500.0
bhrad_m = 10000.0
bptpert_k = 4.0
maintain_rh = true

[grid]
nx = 640
ny = 768
nz = 80
dx_m = 100.0
dy_m = 100.0
dz_m = 100.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = 1               # 20 m layers below 200 m, stretching to 340 m above 7.4 km
ztop_m = 17600.0
str_bot_m = 200.0
str_top_m = 7400.0
dz_bot_m = 20.0
dz_top_m = 340.0

[dynamics]
coriolis = 1
fcor_s_inv = 8.47e-5        # 2 Omega sin(35.5 N)
lspgrad = 1                 # Coriolis acts on the departure from the base-state wind only
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2                    # open on all four sides
east = 2
south = 2
north = 2
bottom = 3                  # semi-slip ground
top = 1
radiative_order = 4

[closures]
sgs_model = 1               # TKE
bbc = 3
sfcmodel = 1
isfcflx = 0
cecd = 1
cnstcd = 0.005              # drag coefficient referenced to 10 m; roughness length 0.035 m
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 3000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true         # the grid travels with the storm
u_move_m_s = 16.5
v_move_m_s = 16.5

[physics]
component = "morrison-mp10"
ihail = 1                   # hail, as CM1's own supercell case
ndcnst = 250.0
equation_set = 2
output_dbz = false

[diagnostics]
output_uh = 1
output_vort = 0             # refused on a stretched column (CM1-OUTPUT-STRETCHED-METRIC)
output_pv = 0
output_sws = 1              # swaths: strongest surface wind, vorticity and pressure fall
output_svs = 1
output_sps = 1
output_srs = 0
output_sgs = 0
output_sus = 0
output_shs = 0
tornado_report = true

[runtime]
tile_nx = 128
tile_ny = 128
acoustic_substeps = 6
warmup_steps = 0
memory_budget_mib = 22000
capacity_profile = "default"

[lagrangian]
iprcl = 0                   # no parcels carried during the run
