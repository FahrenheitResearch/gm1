# A vortex-following 20 m sub-volume, written every child step, so that the
# trajectories into a tornado can be integrated at all.
#
# WHY THIS DECK EXISTS
#
#   Three measured attempts on a 100 m parent with a two-way 20 m nest -- 100k,
#   140k and 135k inline child parcels -- established that a forward lattice
#   does not sample a tornado core.  The best of them put 296 parcels within
#   300 m of the vortex and the maximum vorticity ANY of them ever recorded was
#   2.0 s-1 against the grid's own 4-6 s-1: a 40 m seed lattice slips between a
#   40-60 m core.  Backward trajectories through saved 30 s child history frames
#   do reach the core, but their own position-error estimate was 800-1200 m
#   median, which is twenty core radii, and that estimate scales with the SQUARE
#   of the output interval -- no post-hoc reading of 30 s frames can be made
#   accurate near a 100 m/s core.
#
#   [lagrangian.nest_child_window] is the remedy every study that has answered
#   this question uses (Orf et al. 2017 is the best known): write a small
#   sub-volume around the vortex at the model's own step and integrate backward
#   through it.  GM1 adds one thing to that: the words written are not the
#   completed state a history frame holds but the model's own ADVECTING
#   VELOCITY -- the acoustic small-step average CM1 saves at nrk == nrkmax
#   (src/solve2.F:1290-1301) and hands to parcel.F (src/solve3.F:768-769).
#   Written every child step, that lets the offline integrator step backward
#   through the model's own wind words with no time interpolation at all
#   (cm1core.nest_parcel_backward's wind_source = "model-step"), which removes
#   the dominant error term rather than estimating it.
#
# WHAT IT COSTS, STATED BEFORE THE RUN
#
#   The child below is 20 m with a 0.125 s step, so the stream writes 480
#   records a model minute.  half_width 600 m and top_m 1000 m is 61 x 61 x 22
#   child cells (top face 981.5 m), which with three ghost columns each way for
#   the winds, one ring for the scalars and the held tendency, and with znt
#   because this deck is bbc = 3, is 4.290 MB a record -- 2.059 GB a model
#   minute, 8.24 GB over the four model minutes declared here.
#   budget_bytes_per_model_minute states that, and the door recomputes it from
#   the geometry and refuses the run if it exceeds what is declared.  A stream
#   that discovered its cost by filling the disk would lose the run's next
#   history frame and its restart with it.
#
# WHAT THE WINDOW MAY NOT DO, AND WHY
#
#   * It may not reach the child's specified or relaxation rows -- not even
#     with its three ghost columns -- because those rows carry the parent's
#     interpolated winds, and a trajectory through them would be a trajectory
#     through 100 m words published as 20 m ones.
#   * It may not reach the child's own lid: the level above its top must be a
#     real child level, not tbc's free-slip extrapolation, or every trajectory
#     that touched it would feel a lid the child's interior does not have.
#     top_m = 1000.0 m against a 17.6 km child is far below it.
#   * It always reaches the ground.  There is no k0 key: the air a tornado
#     ingests is in the lowest few hundred metres.
#
# WHERE IT SITS
#
#   follow = "tornado-criterion" takes the centre from [nest.tornado_criterion]
#   -- the first maximum of the child's 10 m corner vorticity, the same centre
#   the verdict is decided on -- at the previous parent step, which is 0.375 s
#   of lag against a kilometre-scale half-width.  Nothing is written before the
#   first centre is found, a sample that finds none holds the last centre, and
#   a centre that would push the window past the free interior is clamped;
#   every record says which of those it was and carries its own ground origin.
#
# READING IT AFTERWARDS (with tools/nest_window_trajectories.py, a source tool in the
# repository, not in the pip package; docs/NESTING.md)
#
#   python3 tools/nest_window_trajectories.py \
#       --stream <history>/nest-child-window --out <new-dir> \
#       --target-time-s 4080 --back-to-s 3960 --centre auto \
#       --radius-m 60 --heights-m 10,60,120,200 --rings 5 --per-ring 24 \
#       --circuit 36
#
#   which seeds an equal-area disk INSIDE the core rather than a lattice across
#   it, integrates backward through the stream with no time interpolation, and
#   publishes the vorticity budget along every trajectory with a closure check.
#   The friction term is the curl of the step's held momentum tendency (CM1's
#   uten1/vten1/wten1), which inside a window below the Rayleigh layer is the
#   subgrid stress of src/turbtend.F; the residual holds the implicit
#   dissipation of the odd-order advection and the discretisation and sampling
#   error.
[run]
lane = "cartesian"
duration_s = 5400.0
dt_s = 0.375
history_interval_s = 60.0
restart_interval_s = 5400.0

[initialization]
isnd = 5
iwnd = 2

[grid]
nx = 800
ny = 800
nz = 80
dx_m = 100.0
dy_m = 100.0
dz_m = 100.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = 1
ztop_m = 17600.0
str_bot_m = 200.0
str_top_m = 7400.0
dz_bot_m = 20.0
dz_top_m = 340.0

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 3
top = 1
radiative_order = 4

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true
u_move_m_s = 12.5
v_move_m_s = 3.0
bbc = 3
sfcmodel = 1
isfcflx = 0
cecd = 1
cnstcd = 0.001

# refinement_ratio = 5 takes 100 m to 20 m; time_refinement_ratio = 3 keeps the
# child's acoustic substep count at CM1's own (src/misclibs.F:883-885).
[nest]
refinement_ratio = 5
time_refinement_ratio = 3
parent_i0 = 350
parent_j0 = 350
parent_span_x = 100
parent_span_y = 100
spec_zone = 1
relax_zone = 4
feedback = 1
acoustic_substeps = 6
follow_storm = true
follow_interval_s = 30.0
follow_max_speed_m_s = 30.0
follow_tracker = "wrf-surface-circulation"
follow_smoothing_radius_m = 1000.0

# The fixed criterion (cm1core.nest_tornado_criterion).  No threshold is a key;
# the window below takes its centre from this.
[nest.tornado_criterion]

[lagrangian]
# The window is the whole of this table's use here: no [lagrangian] parcels are
# integrated, so iprcl keeps CM1's own shipped 0 (run/namelist.input:87).
iprcl = 0

[lagrangian.nest_child_window]
frame = "parent-grid-origin"
follow = "tornado-criterion"
center_x_m = 0.0
center_y_m = 0.0
half_width_x_m = 600.0
half_width_y_m = 600.0
top_m = 1000.0
stride_child_steps = 1
start_s = 3600.0
end_s = 3840.0
budget_bytes_per_model_minute = 2100000000

[runtime]
acoustic_substeps = 6
tile_nx = 64
tile_ny = 64
warmup_steps = 0
memory_budget_mib = 24576
capacity_profile = "default"

[physics]
component = "wsm6-mp6"
equation_set = 2
