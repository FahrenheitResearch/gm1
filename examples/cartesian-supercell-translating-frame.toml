# CM1's own supercell deck configuration: base.F isnd=5 (Weisman-Klemp
# analytic sounding) with iwnd=2 (analytic shear), in the translating frame of
# run/namelist.input:83,101-102 -- imove=1, umove=12.5, vmove=3.0.
#
# base.F:2663-2669 subtracts the frame velocity from the base-state winds once,
# and init3d.F:210-219 copies those into the initial condition, so the whole
# integration runs in coordinates that travel with the storm.  With icor=0
# there is no Coriolis term and this runtime's momentum tendencies carry none,
# so the change of variable is exact rather than an approximation.
#
# That is what buys the domain size: the storm stays near the centre instead of
# tracking about 93 km, so 60 km of width suffices where the fixed-frame
# profile beside this one needs 220 km.  Every wind this run publishes is
# frame-relative; the ground-relative wind is u_move_m_s + u (init3d.F:32-33).
#
# Where the domain itself is, in ground metres, is not left to the reader: the
# runtime carries CM1's running integral, domainlocx = domainlocx + dt*umove
# and domainlocy likewise (cm1.F:3512-3513), advanced once per completed large
# step from zero (cm1.F:348-349).  The pair travels under CM1's own names and
# units in every history frame's envelope and publication receipt, and through
# a resume, so a consumer that knows CM1 reads it without translating
# anything.  Over this run that is 90 km east and 21.6 km north, to the metre.
[run]
lane = "cartesian"
duration_s = 7200.0
dt_s = 0.5
history_interval_s = 60.0
restart_interval_s = 7200.0

[initialization]
isnd = 5
iwnd = 2

[grid]
nx = 60
ny = 60
nz = 40
dx_m = 1000.0
dy_m = 1000.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 1
top = 1
radiative_order = 4

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true
u_move_m_s = 12.5
v_move_m_s = 3.0

[runtime]
acoustic_substeps = 6
tile_nx = 64
tile_ny = 64
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"

[physics]
component = "wsm6-mp6"
equation_set = 2
