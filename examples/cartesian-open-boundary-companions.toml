# CM1's open-boundary companions, all four of them, on the all-open family.
#
# README.namelist:595-602 states the failure `roflux` prevents in so many
# words: without it an open-boundary run can develop a runaway outward mass
# flux causing domain-total mass loss and spurious pressure falls.  gpuwm-cm1
# runs all-open by construction, so it is exposed to exactly that, and this
# document is the deck that turns the protection on.
#
# `nudgeobc` with `alphobc` holds the inflow wind to the declared base state
# (src/solve2.F:726-822), which is what a run initialized from a real
# radiosonde needs if the environment is to stay the one that was declared.
#
# `hrdamp` with `xhd` adds the lateral Rayleigh sponge (src/param.F:8687-8802),
# which absorbs gravity waves before they reflect off the open sides.  Since
# cm1r19.6 it acts on w only.  src/param.F:725 forces hrdamp to equal irdamp
# whenever both are on, so they are declared equal here; gpuwm-cm1 refuses a
# disagreeing pair rather than rewriting it behind the document's back.
#
# `xhd = 12000` is a quarter of each 48 km side, so src/param.F:8689's
# half-domain stop does not fire.

[run]
lane = "cartesian"
duration_s = 60.0
dt_s = 1.0
history_interval_s = 20.0
restart_interval_s = 60.0

[grid]
nx = 96
ny = 96
nz = 40
dx_m = 500.0
dy_m = 500.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 1
top = 1
radiative_order = 4
roflux = 1
nudgeobc = 1
alphobc = 60.0
cstar = 30.0

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
hrdamp = 1
xhd = 12000.0
moving_frame = false
u_move_m_s = 0.0
v_move_m_s = 0.0

[physics]
component = "wsm6-mp6"
equation_set = 2

[runtime]
acoustic_substeps = 6
tile_nx = 32
tile_ny = 32
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"
