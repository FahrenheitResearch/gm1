# A semi-slip lower boundary whose roughness length is imposed, not derived
# from a drag coefficient.
#
# CM1 r21.1's getcecd has four branches (src/sfcphys.F:81-195) and they are
# not interchangeable.  The one GM1 could reach before this profile existed
# is cecd=1: declare a drag coefficient Cd, and src/sfcphys.F:128 inverts the
# neutral log law for the roughness length that would have produced it at a
# ten-metre reference height.  That is the right knob for a study that wants
# a stated Cd.  It is the wrong knob for a study that wants a stated surface:
# roughness length is what a land cover has, and a tornado-scale run over
# open country is specified by z0, not by the Cd some reference height
# happens to imply.
#
# set_znt=1 (src/sfcphys.F:83-99) is that branch.  init_surface.F:246-254
# writes cnst_znt into every column after the land-use table, so it is the
# roughness the run actually integrates, and getcecd then derives
#
#     Cd  = ( karman / ln(10/z0) )**2
#     u*  = max( |u1| karman / ln(za/z0) , 1e-6 )
#
# from it.  Note what is *not* here: this branch takes ln(10/z0) and
# ln(za/z0), with no z0 added to either height, which is a different
# expression from the cecd=1 branch's ln((10+z0)/z0).  That is CM1's source,
# and copying the wrong one would change the drag by several per cent at a
# roughness this size.
#
# 0.05 m is open grassland.  At this grid's 250 m lowest half-level it gives
# Cd near 3.0e-3 and, in a 20 m/s low-level flow, u* near 0.9 m/s -- surface
# vorticity of the order the near-ground vortex needs, generated by the
# boundary rather than prescribed into it.
#
# isfcflx=0: this is a momentum-drag profile.  The surface enthalpy flux is
# a separate subsystem with its own profile beside this one; leaving it off
# keeps the thermodynamic state the free-slip deck's and isolates the term
# under study.
#
# [surface] is declared in full even though initsfc=1 is CM1's own default,
# because a surface that is not written down is a surface a receipt cannot
# name.  lu0=7 is LANDUSE.TBL's "Grassland"; with set_znt=1 the table's own
# roughness is overwritten by cnst_znt, but its moisture availability and
# albedo still describe the ground, and isfcflx=1 would read them.

[run]
lane = "cartesian"
duration_s = 7200.0
dt_s = 0.5
history_interval_s = 60.0
restart_interval_s = 7200.0

[initialization]
isnd = 5
iwnd = 2

[grid]
nx = 60
ny = 60
nz = 40
dx_m = 1000.0
dy_m = 1000.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 3
top = 1
radiative_order = 4

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true
u_move_m_s = 12.5
v_move_m_s = 3.0
bbc = 3
sfcmodel = 1
isfcflx = 0
cecd = 1
cnstcd = 0.001
cnstce = 0.001
set_znt = 1
cnst_znt = 0.05
set_ust = 0
cnst_ust = 0.25

[surface]
initsfc = 1
tsk0_k = 299.28
tmn0_k = 297.28
xland0 = 1.0
lu0 = 7
season = 1
oceanmodel = 1

[runtime]
acoustic_substeps = 6
tile_nx = 64
tile_ny = 64
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"

[physics]
component = "wsm6-mp6"
equation_set = 2
