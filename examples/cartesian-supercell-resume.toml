# The companion to examples/cartesian-supercell-checkpointed.toml: the same
# two-hour deck, continued from a restart that run wrote.
#
# CM1's selection surface, by its own namelist names:
#   irst   = 1  -- this is a restart (README.namelist:227, cm1.F:2660)
#   rstnum = 8  -- continue from restart number 8 (README.namelist:229-231)
#
#   gpuwm-cm1 cartesian examples/cartesian-supercell-resume.toml \
#     --integrate --history-dir frames-2 --restart-dir restarts-2 \
#     --restart-from restarts --output resumed.json
#
# --restart-from names the previous run's --restart-dir; rstnum picks
# restart-000008 inside it.  run.duration_s is absolute model time, as CM1's
# timax is, so the resumed run integrates from where restart 8 stopped to
# 7200 s rather than running the whole deck again.  The frame and restart
# numbering continues from the counters the restart carried
# (restart_write.F:378,383), so the frames this run publishes are the ones the
# interrupted run had not reached yet, under the indices it would have used.
#
# Everything the restart does not carry is rebuilt from this document and the
# same sounding: README.namelist:1512-1516 records that CM1's own base-state
# restart fields are for specialized applications and that none of them is
# required for a bit-identical restart.  A resume under a changed grid,
# timestep, frame velocity or operator set is refused by name rather than
# continued onto words that no longer mean the same thing.
[run]
lane = "cartesian"
duration_s = 7200.0
dt_s = 0.5
history_interval_s = 60.0
restart_interval_s = 900.0
irst = 1
rstnum = 8

[initialization]
isnd = 7
iwnd = 0

[grid]
nx = 120
ny = 120
nz = 40
dx_m = 1000.0
dy_m = 1000.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 1
top = 1
radiative_order = 4

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = true
u_move_m_s = 12.5
v_move_m_s = 3.0

[runtime]
acoustic_substeps = 6
tile_nx = 64
tile_ny = 64
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"

[physics]
component = "wsm6-mp6"
equation_set = 2
