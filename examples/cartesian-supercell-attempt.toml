# First supercell attempt: CM1 base.F isnd=5 (Weisman-Klemp analytic sounding)
# with iwnd=2 (analytic shear), on CM1's own two-hour clock.
#
# The domain is 220 km rather than CM1's 120 km, deliberately: this profile
# keeps closures.moving_frame off, so the storm tracks about 93 km across a
# FIXED domain in two hours.  The warm bubble is placed at the domain centre,
# which leaves 110 km to the nearest boundary: enough for the whole track.
# cartesian-supercell-translating-frame.toml is the same physics in CM1's own
# translating frame, where 60 km is enough.  run.dt_s is a free parameter
# bounded only by CM1's own dtsmall (misclibs.F:867) and advective Courant
# stop (misclibs.F:2714); the half second declared here is the default, so
# 7200 s is 14400 large steps and a 60 s history interval publishes 120
# frames.  A kilometre grid would admit a considerably larger step; this
# profile keeps the accurate one.
[run]
lane = "cartesian"
duration_s = 7200.0
dt_s = 0.5
history_interval_s = 60.0
restart_interval_s = 7200.0

[initialization]
isnd = 5
iwnd = 2

[grid]
nx = 220
ny = 220
nz = 40
dx_m = 1000.0
dy_m = 1000.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 2
east = 2
south = 2
north = 2
bottom = 1
top = 1
radiative_order = 4

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = false
u_move_m_s = 0.0
v_move_m_s = 0.0

[runtime]
acoustic_substeps = 6
tile_nx = 64
tile_ny = 64
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"

[physics]
component = "wsm6-mp6"
equation_set = 2
