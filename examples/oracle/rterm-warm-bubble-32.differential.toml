# The rterm=1 differential, run as a PAIR.
#
# Term: rterm -- CM1's Rotunno-Emanuel Newtonian relaxation
# (src/solve1.F:1003-1054, README.namelist:555-558).  It is the one
# "radiation" family GM1 integrates on the device today.
#
# $HARNESS is the CM1 differential harness (docs/ORACLE-DIFFERENTIAL-HARNESS.md), kept with the development repository.
#   PYTHONPATH=src python3 $HARNESS/differential.py horizon --term rterm \
#       --nx 32 --ny 32 --nz 40 --dx 1000 --dy 1000 --dz 500 --dt 1.0
#
#   timescale 43200 s (12 h), horizon tau/100 = 432 s.
#
# Rounded up to 440 s so the 20 s history cadence divides the duration
# exactly (config.py requires an integral frame count).  22 frames.
#
# WHY A PAIR.  The worked acoustic example measured th3d and q3d:qv
# diverging at the open lateral boundary -- two cells inside the east edge,
# growing monotonically, absent under `compare --interior 8`.  That
# divergence is a property of the boundary, not of rterm, and it is
# identical in a run with the term and a run without it.  So this case is
# run twice on each side and the two DIFFERENCES are compared:
#
#   dCM1 = CM1(rterm=1) - CM1(rterm=0)
#   dGM1 = GM1(rterm=1) - GM1(rterm=0)
#
# The boundary divergence cancels exactly between the members, and what
# remains is the term itself.  $HARNESS/rterm_pair.py drives it.
#
# This is the ACTIVE member: rterm = 1.

[case]
name = "rterm-warm-bubble-32"
term = "rterm"
notes = """The rterm=1 member of the paired Rotunno-Emanuel
differential, on the worked example's 32x32x40 1 km / 500 m grid. 440 s is
one hundredth of CM1's 12 h relaxation time, which moves theta' by about
one per cent of its amplitude -- ten times this harness's measured rounding
floor for th3d."""

[cm1]
nx = 32
ny = 32
nz = 40
dx = 1000.0
dy = 1000.0
dz = 500.0
dtl = 1.0
timax = 440.0
tapfrq = 20.0
rstfrq = 440.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2
rterm = 1

irdamp = 1
zd = 15000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4

icor = 0
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid, and the harness refuses a declaration that
# disagrees -- handing the two codes a different number of acoustic small
# steps per large step would measure the schedule, not the term under test.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 8192
"runtime.capacity_profile" = "default"
