# CM1's icor=1 Coriolis term, solve2.F:631-720, between divx and advu.
#
# Horizon.  1/f is about three hours, so a storm run is the wrong test and
# a five-minute one looks like none at all -- until you ask the right
# question, which is not 'has the wind turned' but 'is the term's
# contribution larger than the disagreement these two codes already have'.
# The contribution to u after t seconds is f*V*t; at f=1e-4 and V~20 m/s
# that is 0.56 m/s by t=280 s, about 2e-2 of the wind, against a measured
# icor=0 floor of 5.2e-5 in u3d nrmse.  So 280 s is decisive by two orders
# of magnitude, and the measurement bears that out: switching GM1's term
# off multiplies the u3d disagreement by 117 and the v3d disagreement by
# 595.  prs, rho, th3d and w3d move by at most 2.7 times their own
# disagreement, because solve2.F:639-653 writes only uten and vten and
# reaches them only through the winds.
#
# Control: coriolis-fplane-32-icor0.differential.toml.
# Evidence: the CM1 word record coriolis-fplane-32 (development repository)

# The cheapest decisive differential this port can run.
#
# gpuwm-cm1's only configurable lane is "cartesian", and config.py:1666-1679
# binds it to physics.component = "wsm6-mp6" and equation_set = 2.  There is
# therefore no dry configurable lane: the shortest honest comparison is a
# moist one, kept short enough that the dycore -- not the microphysics --
# is what the divergence curve is measuring.
#
# Term: acoustic.  A sound wave crosses one 1000 m cell in 1000/360 = 2.78 s,
# so the decisive horizon is
#
# $HARNESS is the CM1 differential harness (docs/ORACLE-DIFFERENTIAL-HARNESS.md), kept with the development repository.
#   PYTHONPATH=src python3 $HARNESS/differential.py horizon --term acoustic \
#       --nx 32 --ny 32 --nz 40 --dx 1000 --dy 1000 --dz 500 --dt 1.0
#
#   timescale 2.778 s, horizon 278 s = 278 large steps = 1668 acoustic substeps.
#
# Rounded up to 280 s so the 20 s history cadence divides the duration exactly,
# which gpuwm-cm1's config.py:1874-1895 requires.  14 frames, 32x32x40 cells:
# seconds of CM1 wall time and a small GPU run.
#
# The base state is base.F's Weisman-Klemp analytic sounding (isnd=5) with its
# analytic shear profile (iwnd=2).
#
# iwnd=0 would be the cleaner acoustic test -- no mean wind, so nothing is
# advected and the only signal is the bubble's acoustic and buoyant
# adjustment -- and config.py:816-826 admits the (isnd=5, iwnd=0) pair.  The
# runtime does not: gm1_idealized_residency.py refuses it with "the analytic
# Weisman-Klemp sounding lane admits iwnd=2 only".  The door and the
# initializer disagree, so the pair is configurable and unrunnable.  Until
# that is fixed this case carries the shear, and the advective timescale
# (dx/U = 1000/20 = 50 s) sits inside the acoustic horizon rather than
# outside it.

[case]
name = "coriolis-fplane-32"
term = "acoustic"
notes = """psolver=3 split-explicit acoustics with the vertically implicit step, on a
32x32x40 1 km / 500 m grid, with the Weisman-Klemp sounding and its
quarter-circle shear (isnd=5, iwnd=2), Coriolis on an f plane (icor=1,
fcor=0.0001), a fixed frame and a fixed 1 s time step."""

[cm1]
nx = 32
ny = 32
nz = 40
dx = 1000.0
dy = 1000.0
dz = 500.0
dtl = 1.0
timax = 280.0
tapfrq = 20.0
rstfrq = 280.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2

irdamp = 1
zd = 15000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4

icor = 1
fcor = 1.0e-4
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid (4 here), and the translator does the same so both
# codes take the same number of acoustic small steps per large step.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 8192
"runtime.capacity_profile" = "default"
