# The vertical metric, measured against CM1 on a column CM1 itself stretched.
#
# Term: metric.  param.F:8170 defines mh(k) = dz/(zf(k+1)-zf(k)) and
# adv.F:562-572,681-695 multiply every vertical flux difference by rdz*mh(k),
# which is 1/(zf(k+1)-zf(k)).  An operator that uses rdz alone -- or that uses
# the local layer depth as the metric reference instead of the namelist dz --
# is exactly right on a uniform column and wrong on this one, so a uniform
# grid cannot separate the two and this case exists to.
#
# The coordinate is param.F:7819-7953's Wilhelmson-Chen function with
# param.F:7867-7877's segment identity satisfied exactly:
#
#   nk1 = round(str_bot/dz_bot)         = round(1000/100) = 10
#   nk3 = round((ztop-str_top)/dz_top)  = round(3000/300) = 10
#   nk2 = nz - (nk1+nk3)                = 40 - 20        = 20
#   nominal = mean(dz_bot, dz_top) = 200, and nk2*nominal = 4000 m is exactly
#   str_top-str_bot, which is param.F:7828-7877's feasibility check.
#
# The layers run 100 m at the ground to 300 m aloft under an 8 km top, a
# three-fold range, so mh spans 2.0 down to 0.667 and no single scalar dz can
# stand in for it anywhere.  dz itself is 200 m: it is the metric reference
# param.F:8170 divides by and is not any layer's thickness here.
#
# Horizon: one advective cell crossing.
#
# $HARNESS is the CM1 differential harness (docs/ORACLE-DIFFERENTIAL-HARNESS.md), kept with the development repository.
#   PYTHONPATH=src python3 $HARNESS/differential.py horizon --term metric \
#       --nx 32 --ny 32 --nz 40 --dx 1000 --dy 1000 --dz 200 --dt 1.0
#
# 100 s = 100 large steps = 600 acoustic substeps.  On the thinnest layer that
# is 600 * (dt/nsound) / (dz_bot/c) = 600 * 0.167 / 0.286 = 350 acoustic
# crossings of the 100 m layer, so a wrong vertical metric in the acoustic
# column has no room to hide either.  tapfrq divides timax, which
# config.py:1874-1895 requires.
#
# zd is a HEIGHT (param.F:8655) and gpuwm-cm1's upper_damping_depth_m is a
# depth below the model top, which param.F:8193 takes from the generated top w
# level.  The translator builds this column through cm1_vertical_grid to get
# that top, so zd = 6000 becomes a 2000 m damping depth on its own.

[case]
name = "stretched-column-32"
term = "metric"
notes = """CM1 r21.1 stretch_z=1 Wilhelmson-Chen column, 100 m at the ground
to 300 m aloft under an 8 km top, 32x32x40 with 1 km horizontal spacing.
psolver=3 split-explicit acoustics with the vertically implicit step. One
advective cell crossing."""

[cm1]
nx = 32
ny = 32
nz = 40
dx = 1000.0
dy = 1000.0
dz = 200.0
dtl = 1.0
timax = 100.0
tapfrq = 20.0
rstfrq = 100.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2

irdamp = 1
zd = 6000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4

icor = 0
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 1
ztop = 8000.0
str_bot = 1000.0
str_top = 5000.0
dz_bot = 100.0
dz_top = 300.0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid, and the harness refuses a declaration that
# disagrees -- handing the two codes a different number of acoustic small
# steps per large step would measure the schedule, not the term under test.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 2048
"runtime.capacity_profile" = "default"
