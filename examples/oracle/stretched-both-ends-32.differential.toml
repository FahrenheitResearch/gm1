# The ground and the top weights, measured against CM1 on a column that
# stretches all the way.
#
# Term: metric.  As stretched-ground-32, with the stretched segment reaching
# the model top as well (str_top = ztop), so solve3.F:679's cgt1..3 are the
# column's own too.
#
#   nk1 = 0, nk3 = 0, nk2 = nz = 40
#   nominal = mean(dz_bot, dz_top) = 200, and nk2*nominal = 8000 m = ztop.
#
# The lowest three layers are 100, 105.1 and 110.3 m deep and the highest
# three 289.7, 294.9 and 300 m.
#
# Horizon: one advective cell crossing, 100 s, as stretched-column-32.

[case]
name = "stretched-both-ends-32"
term = "metric"
notes = """CM1 r21.1 stretch_z=1 column that stretches from the ground to the model top
(str_bot = 0, str_top = ztop): 100 m at the ground to 300 m at the 8 km top,
32x32x40 with 1 km horizontal spacing. psolver=3 split-explicit acoustics with
the vertically implicit step. One advective cell crossing."""

[cm1]
nx = 32
ny = 32
nz = 40
dx = 1000.0
dy = 1000.0
dz = 200.0
dtl = 1.0
timax = 100.0
tapfrq = 20.0
rstfrq = 100.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2

irdamp = 1
zd = 6000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4

icor = 0
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 1
ztop = 8000.0
str_bot = 0.0
str_top = 8000.0
dz_bot = 100.0
dz_top = 300.0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid, and the harness refuses a declaration that
# disagrees -- handing the two codes a different number of acoustic small
# steps per large step would measure the schedule, not the term under test.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 2048
"runtime.capacity_profile" = "default"
