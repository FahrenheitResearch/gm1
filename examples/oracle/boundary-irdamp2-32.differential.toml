# irdamp=2: damp toward the evolving horizontal average.
#
# CM1 recommends it for long runs and two shipped decks use it
# (cpm_RadConvEquil, les_HurrCoast).  src/solve1.F:427-438 replaces the frozen
# base state with get_avg_uvtq's area-weighted level mean, so the upper sponge
# stops pulling a drifted mean state back to its initial condition.
#
# Term: damping.  1/rdalpha = 300 s.  280 s is 0.93 e-foldings inside the
# Rayleigh layer, and the difference between irdamp=1 and irdamp=2 is the
# departure of the level mean from the base state, which the bubble creates in
# the first frames.

[case]
name = "boundary-irdamp2-32"
term = "damping"
notes = """all-open laterals with irdamp=2 (damp toward the horizontal
average) on a 32x32x40 1 km / 500 m grid."""

[cm1]
nx = 32
ny = 32
nz = 40
dx = 1000.0
dy = 1000.0
dz = 500.0
dtl = 1.0
timax = 280.0
tapfrq = 20.0
rstfrq = 280.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2

irdamp = 2
hrdamp = 0
xhd = 100000.0
zd = 15000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4
roflux = 0
nudgeobc = 0
alphobc = 60.0
cstar = 30.0

icor = 0
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid, and the harness refuses a declaration that
# disagrees -- handing the two codes a different number of acoustic small
# steps per large step would measure the schedule, not the term under test.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 8192
"runtime.capacity_profile" = "default"
