# The ground weights, measured against CM1 on a column that stretches from the ground.
#
# Term: metric.  param.F:8985-9060 fits a quadratic through the lowest three
# scalar levels and solve3.F:678 extrapolates the density to the ground with
# its weights, cgs1..3.  On a column whose lowest three layers are equally
# deep those weights are 1.875, -1.25 and 0.375.  With str_bot = 0, CM1's
# common setting, the layers thicken from the first one and the weights are
# the column's own.  stretched-column-32 keeps ten equal layers at each end
# and cannot tell the two apart; this case exists to.
#
# The coordinate is param.F:7819-7953's function with no uniform segment at
# the ground:
#
#   nk1 = round(str_bot/dz_bot)         = 0
#   nk3 = round((ztop-str_top)/dz_top)  = round(3000/300) = 10
#   nk2 = nz - (nk1+nk3)                = 35 - 10        = 25
#   nominal = mean(dz_bot, dz_top) = 200, and nk2*nominal = 5000 m is exactly
#   str_top-str_bot, which is param.F:7828-7877's feasibility check.
#
# The lowest three layers are 100, 108.3 and 116.7 m deep, so cgs is
# (1.8215, -1.1378, 0.3162).  The ten 300 m layers under the 8 km top keep
# 1.875, -1.25 and 0.375 there.
#
# Horizon: one advective cell crossing, 100 s, as stretched-column-32.

[case]
name = "stretched-ground-32"
term = "metric"
notes = """CM1 r21.1 stretch_z=1 column that stretches from the ground (str_bot = 0):
100 m at the ground to 300 m aloft under an 8 km top, 32x32x35 with 1 km
horizontal spacing. psolver=3 split-explicit acoustics with the vertically
implicit step. One advective cell crossing."""

[cm1]
nx = 32
ny = 32
nz = 35
dx = 1000.0
dy = 1000.0
dz = 200.0
dtl = 1.0
timax = 100.0
tapfrq = 20.0
rstfrq = 100.0
statfrq = 20.0

psolver = 3
adapt_dt = 0
hadvordrs = 5
vadvordrs = 5
hadvordrv = 5
vadvordrv = 5
advwenos = 2
advwenov = 0
weno_order = 5
apmasscon = 1
sgsmodel = 1
doimpl = 1
eqtset = 2

irdamp = 1
zd = 6000.0
rdalpha = 3.3333333333e-3

wbc = 2
ebc = 2
sbc = 2
nbc = 2
bbc = 1
tbc = 1
irbc = 4

icor = 0
imove = 0
umove = 0.0
vmove = 0.0

isnd = 5
iwnd = 2

stretch_x = 0
stretch_y = 0
stretch_z = 1
ztop = 8000.0
str_bot = 0.0
str_top = 5000.0
dz_bot = 100.0
dz_top = 300.0

isfcflx = 0
sfcmodel = 0
cecd = 1
cnstcd = 0.001

[gm1]
"run.lane" = "cartesian"
"physics.component" = "wsm6-mp6"
# runtime.acoustic_substeps is NOT declared: misclibs.F:818-915 derives it
# from dtl and the grid, and the harness refuses a declaration that
# disagrees -- handing the two codes a different number of acoustic small
# steps per large step would measure the schedule, not the term under test.
"runtime.tile_nx" = 32
"runtime.tile_ny" = 32
"runtime.warmup_steps" = 0
"runtime.memory_budget_mib" = 2048
"runtime.capacity_profile" = "default"
