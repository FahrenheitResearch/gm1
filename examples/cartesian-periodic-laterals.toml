# A doubly periodic Cartesian domain: wbc = ebc = sbc = nbc = 1.
#
# Nineteen of CM1 r21.1's twenty-three shipped configuration decks use this
# lateral family, and before int/boundaries gpuwm-cm1 could not express any of
# them: config.py sealed the Cartesian lane to the all-open tuple.
#
# Periodic laterals are how an environment is held fixed while turbulence
# equilibrates.  There is no outward mass flux to restrict and no inflow face
# to nudge, so `roflux`, `nudgeobc` and `irbc` are inert here -- src/bc.F and
# src/solve2.F consult all three only on a side whose value is 2 -- and they
# are declared as CM1's own cm1.F values rather than omitted, so the document
# says what the run integrates.
#
# Authority: README.namelist:561-568; src/bc.F:180-1143 (the periodic branches
# of bcs/bcp/bcu/bcv/bcw); src/param.F:6678-6681 (ibw=0 for wbc=1, which is
# what gives the boundary face of src/sound.F:388 to the pressure gradient).

[run]
lane = "cartesian"
duration_s = 60.0
dt_s = 1.0
history_interval_s = 20.0
restart_interval_s = 60.0

[grid]
nx = 96
ny = 96
nz = 40
dx_m = 500.0
dy_m = 500.0
dz_m = 500.0
terrain = false
stretch_x = false
stretch_y = false
stretch_z = false

[dynamics]
psolver = 3
adaptive_timestep = false
scalar_horizontal_order = 5
scalar_vertical_order = 5
velocity_horizontal_order = 5
velocity_vertical_order = 5
scalar_weno = 2
velocity_weno = 0
weno_order = 5
dry_mass_correction = true

[boundaries]
west = 1
east = 1
south = 1
north = 1
bottom = 1
top = 1
radiative_order = 4
roflux = 0
nudgeobc = 0
alphobc = 60.0
cstar = 30.0

[closures]
sgs_model = 1
vertical_implicit_diffusion = true
upper_damping = 1
upper_damping_depth_m = 5000.0
upper_damping_rate_s_inv = 0.0033333333333
moving_frame = false
u_move_m_s = 0.0
v_move_m_s = 0.0

[physics]
component = "wsm6-mp6"
equation_set = 2

[runtime]
acoustic_substeps = 6
tile_nx = 32
tile_ny = 32
warmup_steps = 0
memory_budget_mib = 8192
capacity_profile = "default"
